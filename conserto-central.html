<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conserto da Central</title>
<style>
:root{--ink:#17233f;--ink2:#3c4a6b;--muted:#7a839e;--line:#e3e8f2;--pri:#1c4fa0;--ok:#0f8a4d;--bad:#c0392b;--amber:#9a6a00}
*{box-sizing:border-box;margin:0}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:#eef1f8;color:var(--ink);padding:16px;max-width:760px;margin:0 auto}
h1{font-size:20px;margin:8px 0 4px}
.sub{color:var(--muted);font-size:13.5px;margin-bottom:14px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
button{border:0;border-radius:11px;padding:12px 18px;font-weight:800;font-size:15px;cursor:pointer}
.pri{background:var(--pri);color:#fff}
.ok{background:var(--ok);color:#fff}
button:disabled{opacity:.5;cursor:default}
.alert{border-radius:10px;padding:10px 12px;font-size:13.5px;margin-top:10px;background:#fdf4df;color:var(--amber)}
.alert.green{background:#e8f6ee;color:var(--ok)}
.alert.red{background:#fdecea;color:var(--bad)}
.lin{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.lin:last-child{border-bottom:0}
.lin b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11.5px;font-weight:800;border-radius:7px;padding:3px 8px;white-space:nowrap}
.t-fix{background:#e3edfb;color:var(--pri)}
.t-del{background:#fdecea;color:var(--bad)}
small{color:var(--muted)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #cdd6ea;border-top-color:var(--pri);border-radius:50%;animation:g .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes g{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<h1>🛠 Conserto da Central de Planejamento</h1>
<div class="sub">Página de uma vez só. Ela arruma, direto na nuvem, os cards que o Planejamento de Equipes criou sem data de montagem — são eles que estão travando a Central. A Central e o Planejamento de Equipes não são alterados.</div>

<div class="card">
  <button class="pri" id="b1" onclick="procurar()">1 · Procurar problemas</button>
  <div id="res"></div>
</div>

<div class="card" id="passo2" style="display:none">
  <button class="ok" id="b2" onclick="consertar()">2 · Consertar agora</button>
  <div id="res2"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const NUVEM = {
  url: 'https://isnczssssikqjukpecsf.supabase.co',
  key: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlzbmN6c3Nzc2lrcWp1a3BlY3NmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTEzNzQ0NDYsImV4cCI6MjEwNjk1MDQ0Nn0.k4VNcRSlP6rrhw22zgDnWbZkZw-eaTjt2iZccsC703E'
};
const esc = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const dia = s => String(s||'').slice(0,10);
const ehData = s => /^\d{4}-\d{2}-\d{2}$/.test(dia(s));
let sb = null, PLANO = [];
function cliente(){
  if(!sb) sb = window.supabase.createClient(NUVEM.url, NUVEM.key);
  return sb;
}
async function procurar(){
  const res = document.getElementById('res');
  document.getElementById('b1').disabled = true;
  res.innerHTML = '<div class="alert"><span class="spin"></span>Lendo os cards da Central…</div>';
  try{
    const r = await cliente().from('plan_eventos').select('id,dados');
    if(r.error) throw r.error;
    const todos = (r.data||[]).map(x=>x.dados).filter(d=>d && d.id);
    PLANO = [];
    todos.forEach(d=>{
      if(ehData(d.mont)) return;                       /* este está bem */
      const outra = [d.evt, d.desm].map(dia).find(x=>/^\d{4}-\d{2}-\d{2}$/.test(x));
      if(outra) PLANO.push({d, acao:'fix', data:outra});          /* ganha a data do evento ou da desmontagem */
      else PLANO.push({d, acao: d.origemPlaneq ? 'del' : 'fix', data: new Date().toISOString().slice(0,10)}); /* sem data nenhuma */
    });
    if(!PLANO.length){
      res.innerHTML = '<div class="alert green">✅ Nenhum card com problema — os '+todos.length+' cards da Central estão com data de montagem. Se a Central ainda travar, me chama de novo no Claude.</div>';
      document.getElementById('b1').disabled = false;
      return;
    }
    res.innerHTML = '<div class="alert red">⚠ '+PLANO.length+' card(s) sem data de montagem — são estes que travam a Central:</div>'+
      PLANO.map(p=>'<div class="lin"><b>'+esc(p.d.nome||'(sem nome)')+'</b>'+
        (p.acao==='del' ? '<span class="tag t-del">será excluído (vazio)</span>'
          : '<span class="tag t-fix">ganha montagem '+p.data.slice(8)+'/'+p.data.slice(5,7)+'</span>')+'</div>').join('')+
      '<div class="alert">Nada mais é mexido: equipe, caminhões e as outras datas desses cards ficam como estão.</div>';
    document.getElementById('passo2').style.display = '';
    document.getElementById('b1').disabled = false;
  }catch(e){
    res.innerHTML = '<div class="alert red">Não consegui ler a Central: '+esc(e.message||e)+'<br>Confere a internet e tenta de novo.</div>';
    document.getElementById('b1').disabled = false;
  }
}
async function consertar(){
  const res = document.getElementById('res2');
  document.getElementById('b2').disabled = true;
  res.innerHTML = '<div class="alert"><span class="spin"></span>Consertando…</div>';
  try{
    const agora = new Date().toISOString();
    const salvar = PLANO.filter(p=>p.acao==='fix').map(p=>{
      p.d.mont = p.data;
      if(!ehData(p.d.desm) && !p.d.manutencao) p.d.desm = p.d.desm || null;
      p.d.hist = [{q:agora, quem:'Conserto', o:['🛠 Card estava sem data de montagem (travava a Central) — ganhou a montagem em '+p.data]}, ...(p.d.hist||[])].slice(0,80);
      return {id:p.d.id, dados:p.d, atualizado_em:agora};
    });
    for(let i=0; i<salvar.length; i+=25){
      const r = await cliente().from('plan_eventos').upsert(salvar.slice(i, i+25));
      if(r.error) throw r.error;
    }
    const del = PLANO.filter(p=>p.acao==='del').map(p=>p.d.id);
    for(let i=0; i<del.length; i+=25){
      const r = await cliente().from('plan_eventos').delete().in('id', del.slice(i, i+25));
      if(r.error) throw r.error;
    }
    res.innerHTML = '<div class="alert green">✅ Pronto — '+salvar.length+' card(s) consertado(s)'+(del.length ? ' e '+del.length+' excluído(s)' : '')+
      '.<br><br><b>Agora feche TODAS as abas da Central e abra de novo.</b> Ela deve voltar ao normal. Depois pode fechar e apagar esta página.</div>';
    PLANO = [];
  }catch(e){
    res.innerHTML = '<div class="alert red">Deu erro no meio: '+esc(e.message||e)+'<br>Pode tocar de novo em Consertar — refazer não estraga nada.</div>';
    document.getElementById('b2').disabled = false;
  }
}
</script>
</body>
</html>
